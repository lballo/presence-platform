# Déploiement Render (même hébergement que PresenceAI) : New → Blueprint → ce dépôt.
services:
  - type: web
    name: presence-platform
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install --legacy-peer-deps --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/trpc/ping
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DB_SCHEMA
        value: presence
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: MEMBERSHIP_URL
        sync: false
      - key: WELCOME_VIDEO_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CALENDLY_URL
        sync: false
      - key: CALENDLY_EXPLO_URL
        sync: false
